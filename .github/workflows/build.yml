name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - name: Test
        run: swift test
      - name: Build
        run: ./build.sh
      - name: Package
        run: ditto -c -k --keepParent build/Musicfy.app build/Musicfy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Musicfy
          path: build/Musicfy.zip
